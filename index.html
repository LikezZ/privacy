<!DOCTYPE html>
<html>
<head>
    <title>游戏隐私政策</title>
</head>
<body>
    <h1>隐私政策</h1>
    <p>最后更新日期：2025年3月10日</p>
    
    <h2>1. 数据收集类型</h2>
    <ul>
        <li>设备标识符（用于反作弊功能）</li>
        <li>游戏内购买记录（用于订单处理）</li>
    </ul>

    <h2>2. 数据用途</h2>
    <p>我们收集数据仅用于：<br>
    - 核心游戏功能（如存档同步）<br>
    - 支付处理（通过第三方 SDK：Apple Pay）</p>

    <h2>3. 数据共享</h2>
    <p>我们不会将数据出售给第三方，仅与以下服务提供商共享：<br>
    - Firebase（用于崩溃分析）<br>
    - Unity Ads（用于展示广告）</p>

    <h2>4. 用户权利</h2>
    <p>您可通过设置页面删除账户或联系 support@game.com 撤回数据授权。</p>
</body>
</html>
